# Conda environment for the DataS1 data_prep.py pipeline
# (scripts/datas1: preflight -> download_train -> build)
#
# Covers imports across:
#   data_prep.py, common.py, stage_download_train.py, stage_build.py,
#   extract_datas1_classes.py (run via subprocess by preflight),
#   validate_schema.py (standalone schema check)
#
# Create:   conda env create -f environment.yaml
# Activate: conda activate datas1-prep


name: datas1-prep
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - ffmpeg
  - libsndfile
  - pip:
      - numpy==1.26.4
      - pandas==2.1.3
      - pyarrow==19.0.1
      - requests==2.32.5
      - pydub==0.25.1
      - tqdm==4.67.1
      - openpyxl==3.1.5
      - soundfile==0.12.1
      - opensoundscape==0.11.0
      - datasets==3.6.0
      - huggingface-hub==0.28.1
      - transformers==4.38.0
      - safetensors==0.7.0
      - torch==2.2.0
      - torchvision==0.17.0