# @package _global_
#package global is neccessary!
defaults:
  - override /datamodule: datas1.yaml
  - override /module: multilabel.yaml
  - override /module/network: efficientnet.yaml
  - override /callbacks: default.yaml
  - override /trainer: single_gpu.yaml
  - override /datamodule/transforms: bird_default_multilabel.yaml
  - override /paths: custom_dataloader.yaml      # forced: datas1 needs ${paths.train_dataset_path}
  - override /hydra: default.yaml

tags: ["birdsetDT", "datas1"]
seed: 1
train: True
test: True

logger:
  wandb:
    tags: ${tags}
    group: "DT_DataS1_efficientnet"
    mode: disabled
    version: DT_efficientnet_${seed}_${start_time}

module:
  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-4
    weight_decay: 5e-4
  save_predictions: True
  network:
    torch_compile: False
    model:
      pretrain_info: null
      local_checkpoint: null

trainer:
  min_epochs: 1
  max_epochs: 30
  accumulate_grad_batches: 2

datamodule:
  dataset:
    val_split: 0.2
    class_weights_loss: null
    class_weights_sampler: null
    classlimit: 600
    eventlimit: 5
  transforms:
    preprocessing:
      spectrogram_conversion:
        n_fft: 2048
        hop_length: 256
        power: 2.0
      melscale_conversion:
        n_mels: 256
        n_stft: 1025
  loaders:
    train:
      batch_size: 64
      num_workers: 12
    valid:
      batch_size: 64
      num_workers: 12
    test:
      batch_size: 64
      num_workers: 12
  mapper:
    biggest_cluster: True
    no_call: False

callbacks:
  model_checkpoint:
    save_last: True
    every_n_epochs: 5
